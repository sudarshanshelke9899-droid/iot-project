<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torrent - Smart IoT Environmental Platform | Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

  <!-- Background Decorative Light Blue Blobs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-200/50 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-sky-300/40 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-20 left-1/3 w-80 h-80 bg-brand-100/60 rounded-full blur-2xl"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 w-full border-b border-brand-200/60 bg-white/70 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-sky-400 flex items-center justify-center text-white shadow-md shadow-brand-500/30">
          <i data-lucide="waves" class="w-6 h-6"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-brand-800 to-brand-600 bg-clip-text text-transparent">
            Torrent
          </span>
          <span class="text-xs ml-1.5 px-2 py-0.5 rounded-full font-semibold bg-brand-100 text-brand-700 border border-brand-200">
            IoT Platform
          </span>
        </div>
      </div>
      <div class="text-xs font-medium text-slate-500 hidden sm:block">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span> ESP8266 &bull; DHT11 &bull; LCD &bull; LED
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

      <!-- Auth Card -->
      <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-xl border border-brand-200/80">
        
        <!-- Header & Icon -->
        <div class="text-center mb-6">
          <div class="inline-flex p-3 rounded-2xl bg-brand-100 text-brand-600 mb-3 border border-brand-200">
            <i data-lucide="cpu" class="w-7 h-7"></i>
          </div>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome to Torrent</h1>
          <p class="text-sm text-slate-500 mt-1">Smart Environmental Monitoring & Automation</p>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm flex items-start space-x-2 border transition-all duration-300">
          <i id="alertIcon" data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
          <span id="alertMessage" class="flex-1"></span>
        </div>

        <!-- Tab Selector: Login vs Register -->
        <div class="flex p-1 bg-brand-100/70 rounded-xl mb-6 border border-brand-200/60">
          <button id="tabLoginBtn" type="button" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-brand-700 shadow-sm">
            Sign In
          </button>
          <button id="tabRegisterBtn" type="button" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-600 hover:text-brand-700">
            Register
          </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </span>
              <input 
                id="loginEmail" 
                type="email" 
                required 
                placeholder="student@gcoey.ac.in"
                class="w-full pl-9 pr-4 py-2.5 bg-white/90 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-slate-800"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input 
                id="loginPassword" 
                type="password" 
                required 
                placeholder="••••••••"
                class="w-full pl-9 pr-4 py-2.5 bg-white/90 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-slate-800"
              />
            </div>
          </div>

          <button 
            type="submit" 
            id="loginSubmitBtn"
            class="w-full mt-2 py-3 px-4 rounded-xl text-white font-medium bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 active:scale-[0.99] shadow-md shadow-brand-500/25 transition-all flex items-center justify-center space-x-2"
          >
            <span>Sign In to Dashboard</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Full Name</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input 
                id="regName" 
                type="text" 
                required 
                placeholder="Sudarshan Patil"
                class="w-full pl-9 pr-4 py-2.5 bg-white/90 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-slate-800"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </span>
              <input 
                id="regEmail" 
                type="email" 
                required 
                placeholder="sudarshan@gcoey.ac.in"
                class="w-full pl-9 pr-4 py-2.5 bg-white/90 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-slate-800"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input 
                id="regPassword" 
                type="password" 
                required 
                placeholder="At least 6 characters"
                class="w-full pl-9 pr-4 py-2.5 bg-white/90 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-slate-800"
              />
            </div>
          </div>

          <button 
            type="submit" 
            id="registerSubmitBtn"
            class="w-full mt-2 py-3 px-4 rounded-xl text-white font-medium bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 active:scale-[0.99] shadow-md shadow-brand-500/25 transition-all flex items-center justify-center space-x-2"
          >
            <span>Create Account</span>
            <i data-lucide="check-circle" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-200/70 text-center">
          <p class="text-xs text-slate-500">
            Hardware: <span class="font-medium text-slate-700">ESP8266 &bull; DHT11 &bull; 16x2 LCD &bull; LED D0</span>
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Required Footer -->
  <footer class="relative z-10 w-full py-5 text-center text-xs text-slate-600 border-t border-brand-200/60 bg-white/60 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4">
      <p class="font-medium">
        Designed and Developed by Sudarshan , Dept. of Electrical Engineering, GCOEY
      </p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
